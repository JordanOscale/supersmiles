<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#141020;font-family:'Plus Jakarta Sans',sans-serif;position:relative;overflow:hidden}
.glow{position:absolute;width:900px;height:900px;right:-220px;bottom:-380px;border-radius:50%;
background:radial-gradient(circle,rgba(197,100,187,.9) 0%,rgba(140,82,255,.35) 45%,transparent 70%)}
.wrap{position:relative;padding:66px 72px;height:100%;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:18px;margin-bottom:74px}
.brand img{height:64px;width:64px;border-radius:50%}
.brand span{color:#F5F0E8;font-weight:800;font-size:23px;letter-spacing:.14em}
h1{color:#fff;font-weight:800;font-size:70px;line-height:1.07;letter-spacing:-.02em}
.rule{width:62px;height:5px;background:#FA7677;margin:34px 0 30px;border-radius:3px}
p{color:#D6D0E1;font-size:29px;line-height:1.42;font-weight:500}
.foot{margin-top:auto;display:flex;align-items:center;gap:28px}
.chip{background:#fff;color:#3C1E78;font-weight:700;font-size:21px;padding:15px 30px;border-radius:100px}
.url{color:#C8BED7;font-weight:700;font-size:21px}
</style></head><body>
<div class="glow"></div>
<div class="wrap">
  <div class="brand"><img src="../assets/favicon-v3.png"><span>SUPER SMILES</span></div>
  <h1>Use your super for<br>urgent dental work.</h1>
  <div class="rule"></div>
  <p>We prepare your whole ATO application<br>and guide you through lodging it.</p>
  <div class="foot"><span class="chip">Free eligibility check</span><span class="url">supersmiles.au</span></div>
</div></body></html>

<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#07070B;font-family:'Plus Jakarta Sans',sans-serif;position:relative;overflow:hidden}
.glow{position:absolute;width:880px;height:880px;right:-210px;bottom:-360px;border-radius:50%;
background:radial-gradient(circle,rgba(197,100,187,.85) 0%,rgba(140,82,255,.3) 46%,transparent 71%)}
.wrap{position:relative;padding:78px 82px;height:100%;display:flex;flex-direction:column;justify-content:center}
.logo{height:84px;width:auto;margin-bottom:56px}
h1{color:#fff;font-weight:800;font-size:72px;line-height:1.07;letter-spacing:-.025em}
.rule{width:66px;height:5px;background:#FA7677;margin:36px 0 32px;border-radius:3px}
p{color:#CEC8DA;font-size:31px;line-height:1.44;font-weight:500}
</style></head><body>
<div class="glow"></div>
<div class="wrap">
  <img class="logo" src="../assets/logo-dark.png">
  <h1>Use your super for<br>urgent dental work.</h1>
  <div class="rule"></div>
  <p>We prepare your whole ATO application<br>and guide you through lodging it.</p>
</div></body></html>
